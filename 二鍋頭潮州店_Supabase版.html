<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二鍋頭東山鴨頭・潮州店 營運管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --milk-50:#fdf8f3;--milk-100:#f5ead8;--milk-200:#ead4b0;--milk-300:#d9b98a;
  --milk-400:#c49c6a;--milk-500:#a87d4e;--milk-600:#8a6340;--milk-700:#6e4e32;
  --milk-800:#523a25;--milk-900:#36261a;
  --warm-white:#fefcf8;--card-bg:#fffdf9;--border:#e8dcc8;--border-light:#f0e8d8;
  --text-primary:#2d1f10;--text-secondary:#7a5c3a;--text-muted:#b09070;
  --success:#4a7c59;--success-bg:#edf5f0;
  --warning:#b07a20;--warning-bg:#fdf3e0;
  --danger:#8c3030;--danger-bg:#fdf0f0;
  --info:#2a5a8c;--info-bg:#eef3fa;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--milk-50);color:var(--text-primary);font-size:14px;line-height:1.6;min-height:100vh}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:224px;background:var(--milk-900);color:#f5ead8;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sidebar-brand{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-logo{font-family:'Noto Serif TC',serif;font-size:13.5px;font-weight:700;color:#f5ead8;line-height:1.45}
.brand-sub{font-size:10px;color:var(--milk-400);margin-top:3px;letter-spacing:.6px}
.sync-row{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10px;color:var(--milk-500)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--milk-600);flex-shrink:0;transition:background .4s}
.sync-dot.online{background:#4a9c69}
.sync-dot.syncing{background:#c49c2a;animation:blink .9s infinite}
.sync-dot.error{background:#a84040}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-section{margin-bottom:18px}
.nav-label{font-size:9px;letter-spacing:1.6px;color:var(--milk-500);padding:0 8px;margin-bottom:6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--milk-300);transition:all .18s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.08);color:#f5ead8}
.nav-item.active{background:var(--milk-700);color:#f5ead8;font-weight:500}

/* Main */
.main{margin-left:224px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--warm-white);border-bottom:1px solid var(--border);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700}
.topbar-date{font-size:11.5px;color:var(--text-muted)}

/* Loading bar */
.lbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;pointer-events:none}
.lbar-fill{height:100%;background:var(--milk-500);width:0;transition:width .35s ease,opacity .3s;opacity:0}

.content{padding:22px 26px;flex:1}

/* Cards */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-title{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:12px}
.cg{display:grid;gap:12px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.c4{grid-template-columns:repeat(4,1fr)}

/* Metrics */
.metric{background:var(--milk-50);border:1px solid var(--border-light);border-radius:10px;padding:14px 16px}
.ml{font-size:11px;color:var(--text-muted);margin-bottom:5px}
.mv{font-size:22px;font-weight:700;font-family:'Noto Serif TC',serif}
.ms{font-size:11px;color:var(--text-muted);margin-top:2px}
.mbadge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:4px;font-weight:500}
.bs{background:var(--success-bg);color:var(--success)}
.bw{background:var(--warning-bg);color:var(--warning)}
.bd{background:var(--danger-bg);color:var(--danger)}

/* Forms */
input,select,textarea{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text-primary);background:var(--warm-white);width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--milk-400)}
.fr{display:grid;gap:10px;margin-bottom:10px}
.fr.c2{grid-template-columns:1fr 1fr}
.fr.c3{grid-template-columns:1fr 1fr 1fr}
label{font-size:11px;color:var(--text-secondary);margin-bottom:3px;display:block;font-weight:500}
.fg{display:flex;flex-direction:column}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .15s;border:none;font-weight:500}
.btn-p{background:var(--milk-700);color:#f5ead8}
.btn-p:hover{background:var(--milk-800)}
.btn-p:disabled{background:var(--milk-500);cursor:not-allowed;opacity:.8}
.btn-s{background:transparent;border:1px solid var(--border);color:var(--text-secondary)}
.btn-s:hover{background:var(--milk-100)}
.btn-d{background:var(--danger-bg);color:var(--danger);border:1px solid #e8c0c0}
.btn-d:hover{background:#f5dada}
.btn-ok{background:var(--success-bg);color:var(--success);border:1px solid #c0ddc9}
.btn-sm{padding:5px 10px;font-size:12px}

/* Tables */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--milk-50)}
td{font-size:13px;padding:10px 12px;border-bottom:1px solid var(--border-light)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--milk-50)}

/* Helpers */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.st{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700}
.divider{height:1px;background:var(--border-light);margin:14px 0}
.rf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.tsm{font-size:12px}.tmut{color:var(--text-muted)}
.tok{color:var(--success)}.tdan{color:var(--danger)}
.tr{text-align:right}.fb{font-weight:700}.fser{font-family:'Noto Serif TC',serif}

/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.a-ok{background:var(--success-bg);color:var(--success);border:1px solid #c0ddc9}
.a-w{background:var(--warning-bg);color:var(--warning);border:1px solid #e8d0a0}
.a-d{background:var(--danger-bg);color:var(--danger);border:1px solid #e8c0c0}
.a-i{background:var(--info-bg);color:var(--info);border:1px solid #b0c8e8}

/* Progress */
.pbar{height:8px;background:var(--border-light);border-radius:4px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .4s}
.pok{background:var(--success)}.pw{background:var(--warning)}.pd{background:var(--danger)}

/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card-bg);border-radius:16px;padding:26px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--border)}
.mtitle{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;margin-bottom:16px}

/* Chips */
.chip-list{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--warm-white)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border)}
.chip-v{background:var(--milk-100);color:var(--milk-800);border-color:var(--milk-300)}
.chip-a{background:#eef3fa;color:#2a5a8c;border-color:#b5d4f4}
.chip-b{background:#f3eef8;color:#5a2a8c;border-color:#dbb5f4}
.chip-del{background:none;border:none;cursor:pointer;color:inherit;opacity:.55;padding:0;font-size:13px;line-height:1}
.chip-del:hover{opacity:1}
.ai{display:flex;gap:6px;margin-top:8px}
.ai input{flex:1}
.ss{background:var(--milk-50);border:1px solid var(--border-light);border-radius:10px;padding:14px;margin-bottom:12px}
.ss-title{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.ta{background:#eef3fa;color:#2a5a8c}.tb{background:#f3eef8;color:#5a2a8c}

.sx{overflow-x:auto}.nw{white-space:nowrap}

/* Spinner */
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .6s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

/* Toast */
#toasts{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--milk-800);color:#f5ead8;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .22s ease;max-width:300px}
.toast.ok{background:#3a6b48}.toast.err{background:#7a2828}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.ploading{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--text-muted);font-size:13px;gap:10px}
.pspin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--milk-500);border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<div class="lbar"><div class="lbar-fill" id="lf"></div></div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">二鍋頭東山鴨頭</div>
      <div class="brand-sub">潮州店 · 營運管理系統</div>
      <div class="sync-row">
        <div class="sync-dot" id="sdot"></div>
        <span id="slabel">連線中...</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">總覽</div>
        <div class="nav-item" data-p="dashboard">◈ 營運總覽</div>
      </div>
      <div class="nav-section">
        <div class="nav-label">每日記錄</div>
        <div class="nav-item" data-p="daily">◇ 每日營業額</div>
        <div class="nav-item" data-p="purchase">◆ 進貨記錄</div>
      </div>
      <div class="nav-section">
        <div class="nav-label">月度管理</div>
        <div class="nav-item" data-p="monthly">▽ 月度報表</div>
        <div class="nav-item" data-p="staff">▲ 人事薪資</div>
        <div class="nav-item" data-p="expense">○ 支出管理</div>
      </div>
      <div class="nav-section">
        <div class="nav-label">分析報告</div>
        <div class="nav-item" data-p="analysis">◉ 成本分析</div>
        <div class="nav-item" data-p="yearly">◎ 年度報表</div>
      </div>
      <div class="nav-section">
        <div class="nav-label">系統設定</div>
        <div class="nav-item" data-p="settings">⚙ 廠商與品項設定</div>
      </div>
    </nav>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="ttitle">營運總覽</div>
      <div class="topbar-date" id="tdate"></div>
    </div>
    <div class="content" id="content">
      <div class="ploading"><div class="pspin"></div>連線至 Supabase 雲端...</div>
    </div>
  </div>
</div>

<div id="mc"></div>
<div id="toasts"></div>

<script>
// ══════════════════════════════════════════════
//  SUPABASE CONFIG
// ══════════════════════════════════════════════
const SB_URL = 'https://ghzbanepobjheethmpof.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoemJhbmVwb2JqaGVldGhtcG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjU2NzQsImV4cCI6MjA5NDMwMTY3NH0.9PRjQmvNr261gYBQBoN9WK0HPnSV2ZvgFbDnT_itbAY';
const HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

// ── REST helpers ─────────────────────────────
async function sbGet(table, params = '') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}&order=created_at.asc`, { headers: HDR });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method: 'POST', headers: HDR, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers: { ...HDR, Prefer: 'return=minimal' } });
  if (!r.ok) throw new Error(await r.text());
}
async function sbUpsert(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method: 'POST', headers: { ...HDR, Prefer: 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ══════════════════════════════════════════════
//  GLOBALS & CACHE
// ══════════════════════════════════════════════
const NOW = new Date();
let selYear = NOW.getFullYear(), selMonth = NOW.getMonth() + 1;
const C = { daily:[], purchases:[], staff:[], expenses:[], vendors:[], itemsA:[], itemsB:[], loaded:{} };

const DEFAULT_VENDORS = ['泰禾食品','振昌肉品','大成食品','家樂福','全聯','其他'];
const DEFAULT_ITEMS_A = ['豬肉','鴨頭','鴨頸','鴨翅','鴨腳','豆腐','蔬菜','香料','醬料','油品'];
const DEFAULT_ITEMS_B = ['包裝袋','紙袋','打包盒','免洗餐具','衛生紙','塑膠袋','標籤貼紙'];
const EXP_TYPES = ['人事薪資','租金','電信費','台電','水電費','其他'];

// ══════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════
const $ = id => document.getElementById(id);
function sync(s, lbl) { const d=$('sdot'), l=$('slabel'); if(d) d.className='sync-dot '+s; if(l) l.textContent=lbl; }
function loading(on) {
  const f=$('lf'); if(!f) return;
  if(on){ f.style.opacity='1'; f.style.width='0'; requestAnimationFrame(()=>f.style.width='65%'); }
  else { f.style.width='100%'; setTimeout(()=>{ f.style.opacity='0'; setTimeout(()=>f.style.width='0',300); },200); }
}
function toast(msg, type='') {
  const c=$('toasts'); if(!c) return;
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),320); },2600);
}
function showModal(html) {
  $('mc').innerHTML=`<div class="mov" id="mov"><div class="modal">${html}</div></div>`;
  $('mov').addEventListener('click', e=>{ if(e.target.id==='mov') closeModal(); });
}
function closeModal() { $('mc').innerHTML=''; }
const fmt = n => (Math.round(n)||0).toLocaleString();
const $$ = n => '$'+fmt(n);
function getYM(d) { const dt=new Date(d); return {y:dt.getFullYear(),m:dt.getMonth()+1}; }
const dyYM = (y,m) => C.daily.filter(d=>{ const ym=getYM(d.date); return ym.y==y&&ym.m==m; });
const puYM = (y,m) => C.purchases.filter(d=>{ const ym=getYM(d.date); return ym.y==y&&ym.m==m; });
const exYM = (y,m) => C.expenses.filter(d=>d.year==y&&d.month==m);
const stYM = (y,m) => C.staff.filter(s=>s.year==y&&s.month==m);
function rev(d) {
  const st=Number(d.store||0), fp=Number(d.foodpanda||0)*.67, ub=Number(d.ubereats||0)*.69;
  return {store:st,fp,ub,total:st+fp+ub,raw:st+Number(d.foodpanda||0)+Number(d.ubereats||0)};
}
const vNames = () => C.vendors.map(v=>v.name);
const iNamesA = () => C.itemsA.map(v=>v.name);
const iNamesB = () => C.itemsB.map(v=>v.name);

function ymSel(y,m,fn,id='ym') {
  const yrs=[]; for(let i=NOW.getFullYear();i>=2023;i--) yrs.push(i);
  return `<div class="rf">
    <div class="fg" style="width:90px"><select id="${id}-y" onchange="${fn}">${yrs.map(yr=>`<option value="${yr}"${yr==y?' selected':''}>${yr}年</option>`).join('')}</select></div>
    <div class="fg" style="width:80px"><select id="${id}-m" onchange="${fn}">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${(i+1)==m?' selected':''}>${i+1}月</option>`).join('')}</select></div>
  </div>`;
}

// ══════════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════════
async function loadCol(name, table, params='') {
  if(C.loaded[name]) return;
  C[name] = await sbGet(table, params);
  C.loaded[name] = true;
}
async function loadSettings() {
  C.vendors = await sbGet('settings_vendors');
  C.itemsA  = await sbGet('settings_items_a');
  C.itemsB  = await sbGet('settings_items_b');
  // Seed defaults if empty
  if(!C.vendors.length) { for(const n of DEFAULT_VENDORS) await sbPost('settings_vendors',{name:n}); C.vendors=await sbGet('settings_vendors'); }
  if(!C.itemsA.length)  { for(const n of DEFAULT_ITEMS_A) await sbPost('settings_items_a',{name:n}); C.itemsA=await sbGet('settings_items_a'); }
  if(!C.itemsB.length)  { for(const n of DEFAULT_ITEMS_B) await sbPost('settings_items_b',{name:n}); C.itemsB=await sbGet('settings_items_b'); }
}

// ══════════════════════════════════════════════
//  ROUTER
// ══════════════════════════════════════════════
const TITLES = {dashboard:'營運總覽',daily:'每日營業額',purchase:'進貨記錄',monthly:'月度報表',staff:'人事薪資',expense:'支出管理',analysis:'成本分析',yearly:'年度報表',settings:'廠商與品項設定'};
const PAGE_COLS = {
  dashboard:['daily','purchases','staff','expenses'],
  daily:['daily'], purchase:['purchases'],
  monthly:['daily','purchases','staff','expenses'],
  staff:['staff'], expense:['expenses','staff','purchases'],
  analysis:['daily','purchases','staff','expenses'],
  yearly:['daily','purchases','staff','expenses'], settings:[]
};
const PAGE_COL_MAP = { daily:['daily','daily'], purchases:['purchases','purchases'], staff:['staff','staff'], expenses:['expenses','expenses'] };

async function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.p===page));
  $('ttitle').textContent = TITLES[page]||page;
  $('content').innerHTML = '<div class="ploading"><div class="pspin"></div>載入中...</div>';
  loading(true);
  const needCols = PAGE_COLS[page]||[];
  for(const col of needCols) {
    if(!C.loaded[col]) {
      const tmap = {daily:'daily',purchases:'purchases',staff:'staff',expenses:'expenses'};
      if(tmap[col]) { C[col]=await sbGet(tmap[col]); C.loaded[col]=true; }
    }
  }
  loading(false);
  ({dashboard:renderDash,daily:renderDaily,purchase:renderPurchase,monthly:renderMonthly,staff:renderStaff,expense:renderExpense,analysis:renderAnalysis,yearly:renderYearly,settings:renderSettings})[page]?.();
}

// ══════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════
function renderDash() {
  $('content').innerHTML=`<div class="sh"><div class="st">月度概覽</div>${ymSel(selYear,selMonth,'updDash()')}</div><div id="db"></div>`;
  updDash();
}
function updDash() {
  const y=Number($('ym-y')?.value||selYear), m=Number($('ym-m')?.value||selMonth);
  selYear=y; selMonth=m;
  const days=dyYM(y,m), purs=puYM(y,m), exps=exYM(y,m), staff=stYM(y,m);

      <div class="card"><div class="card-title">📊 成本佔比</div>
        <div class="rf" style="justify-content:space-between;margin-bottom:6px"><span class="tsm">進貨 ${pR.toFixed(1)}%</span>${badge(pR)}</div>
        <div class="pbar"><div class="pfill ${pR<=30?'pok':pR<=45?'pw':'pd'}" style="width:${Math.min(pR,100)}%"></div></div>
        <div class="divider"></div>

      </div>

      </div>

      </div>

  const y=Number($('ym-y')?.value||selYear),m=Number($('ym-m')?.value||selMonth);selYear=y;selMonth=m;
  const list=exYM(y,m),oT=list.reduce((s,e)=>s+Number(e.amount||0),0),sT=stYM(y,m).reduce((s,st)=>s+Number(st.salary||0),0),pT=puYM(y,m).reduce((s,p)=>s+Number(p.amount||0),0),grand=oT+sT+pT;
  $('eb').innerHTML=`<div class="cg c3"><div class="metric"><div class="ml">固定支出</div><div class="mv">${$$(oT)}</div></div><div class="metric"><div class="ml">人事薪資（自動帶入）</div><div class="mv">${$$(sT)}</div></div><div class="metric"><div class="ml">進貨成本（自動帶入）</div><div class="mv">${$$(pT)}</div></div></div><div class="metric mt12" style="max-width:240px"><div class="ml">當月支出總計</div><div class="mv fser">${$$(grand)}</div></div><div class="card mt12"><div class="card-title">固定支出清單（${y}年${m}月）</div><table><thead><tr><th>類型</th><th>金額</th><th>備註</th><th></th></tr></thead><tbody>${list.map(e=>`<tr><td>${e.type}</td><td class="fb">${$$(e.amount)}</td><td class="tmut tsm">${e.note||'—'}</td><td><button class="btn btn-d btn-sm" onclick="delExp('${e.id}')">刪除</button></td></tr>`).join('')}${list.length===0?'<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:24px">尚無固定支出記錄</td></tr>':''}</tbody></table></div><div class="alert a-i mt12">換月後支出需重新填寫；進貨成本與人事薪資自動帶入</div>`;
}
function showExpModal(){showModal(`<div class="mtitle">新增支出項目</div><div class="fr c2"><div class="fg"><label>支出類型</label><select id="e-t" onchange="togExpC()">${EXP_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fg"><label>金額</label><input type="number" id="e-a" placeholder="0" min="0"></div></div><div id="ec" style="display:none" class="fg mt8"><label>自訂類型名稱</label><input type="text" id="e-ct" placeholder="輸入類型"></div><div class="fg mt8"><label>備註</label><input type="text" id="e-n" placeholder="可選"></div><div class="divider"></div><div class="rf" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" onclick="closeModal()">取消</button><button class="btn btn-p" id="bse" onclick="saveExp()">儲存至雲端</button></div>`);}
function togExpC(){const t=$('e-t')?.value,r=$('ec');if(r)r.style.display=t==='其他'?'block':'none';}
async function saveExp(){
  const tSel=$('e-t').value,type=tSel==='其他'?($('e-ct').value||'其他'):tSel,amount=Number($('e-a').value||0);
  if(!amount)return alert('請填寫金額');
  const btn=$('bse');if(btn){btn.disabled=true;btn.innerHTML='<div class="spin"></div> 儲存中';}
  const[row]=await sbPost('expenses',{year:selYear,month:selMonth,type,amount,note:$('e-n').value});
  C.expenses.push(row);toast('支出已儲存','ok');closeModal();rendExpList();
}
async function delExp(id){if(!confirm('確定刪除？'))return;await sbDelete('expenses',id);C.expenses=C.expenses.filter(e=>e.id!==id);toast('已刪除');rendExpList();}

// ══════════════════════════════════════════════
//  MONTHLY
// ══════════════════════════════════════════════
function renderMonthly(){$('content').innerHTML=`<div class="sh"><div class="st">月度報表</div>${ymSel(selYear,selMonth,'rendMonthly()')}</div><div id="mb"></div>`;rendMonthly();}
function rendMonthly(){
  const y=Number($('ym-y')?.value||selYear),m=Number($('ym-m')?.value||selMonth);selYear=y;selMonth=m;
  const days=dyYM(y,m),purs=puYM(y,m),exps=exYM(y,m),staff=stYM(y,m);
  const stR=days.reduce((s,d)=>s+Number(d.store||0),0),fpRaw=days.reduce((s,d)=>s+Number(d.foodpanda||0),0),ubRaw=days.reduce((s,d)=>s+Number(d.ubereats||0),0);
  const fpA=fpRaw*.67,ubA=ubRaw*.69,tAdj=stR+fpA+ubA,wD=days.length;
  const pC=purs.reduce((s,p)=>s+Number(p.amount||0),0),sC=staff.reduce((s,st)=>s+Number(st.salary||0),0),oC=exps.reduce((s,e)=>s+Number(e.amount||0),0),tExp=pC+sC+oC,profit=tAdj-tExp;
  let pm=m-1,py=y;if(pm<1){pm=12;py--;}
  const prevA=dyYM(py,pm).reduce((s,d)=>s+rev(d).total,0),gr=prevA>0?((tAdj-prevA)/prevA*100).toFixed(1):null;
  const pR=tAdj>0?pC/tAdj*100:0,sR=tAdj>0?sC/tAdj*100:0,eR=tAdj>0?tExp/tAdj*100:0;
  const sb=(r,g=30,ok=45)=>r<=g?'<span class="mbadge bs">優良</span>':r<=ok?'<span class="mbadge bw">尚可</span>':'<span class="mbadge bd">欠佳</span>';
  $('mb').innerHTML=`<div class="cg c4"><div class="metric"><div class="ml">月工作天數</div><div class="mv">${wD} 天</div></div><div class="metric"><div class="ml">月總實收</div><div class="mv fser">${$$(tAdj)}</div></div><div class="metric"><div class="ml">平均每日</div><div class="mv">${$$(wD>0?tAdj/wD:0)}</div></div><div class="metric"><div class="ml">本月損益</div><div class="mv ${profit>=0?'tok':'tdan'} fser">${profit>=0?'+':''}${$$(profit)}</div></div></div>
  <div class="cg c2 mt12">
    <div class="card"><div class="card-title">營業額明細</div><table>
      <tr><td>門市</td><td class="tr">${$$(stR)}</td></tr>
      <tr><td>Foodpanda 原始</td><td class="tr">${$$(fpRaw)}</td></tr>
      <tr><td class="tmut tsm">扣抽成 33%</td><td class="tr tmut">-${$$(fpRaw*.33)}</td></tr>
      <tr><td>FP 實收</td><td class="tr">${$$(fpA)}</td></tr>
      <tr><td>Uber Eats 原始</td><td class="tr">${$$(ubRaw)}</td></tr>
      <tr><td class="tmut tsm">扣抽成 31%</td><td class="tr tmut">-${$$(ubRaw*.31)}</td></tr>
      <tr><td>UE 實收</td><td class="tr">${$$(ubA)}</td></tr>
      <tr><td class="fb">月總實收</td><td class="tr fb">${$$(tAdj)}</td></tr>
    </table></div>
    <div class="card"><div class="card-title">支出明細</div><table>
      <tr><td>進貨成本</td><td class="tr">${$$(pC)}</td></tr>
      <tr><td>人事薪資</td><td class="tr">${$$(sC)}</td></tr>
      ${exps.map(e=>`<tr><td>${e.type}</td><td class="tr">${$$(e.amount)}</td></tr>`).join('')}
      <tr><td class="fb">支出合計</td><td class="tr fb">${$$(tExp)}</td></tr>
    </table><div class="divider"></div>
    <div class="rf" style="justify-content:space-between"><span class="fb">本月實賺</span><span class="fb ${profit>=0?'tok':'tdan'}" style="font-size:16px">${profit>=0?'+':''}${$$(profit)}</span></div></div>
  </div>
  <div class="card mt12"><div class="card-title">成本佔比</div><div class="cg c3">${[{l:'進貨',v:pR,g:30,ok:45},{l:'人事',v:sR,g:30,ok:45},{l:'總支出',v:eR,g:60,ok:80}].map(it=>`<div><div class="rf" style="justify-content:space-between;margin-bottom:6px"><span class="tsm">${it.l} ${it.v.toFixed(1)}%</span>${sb(it.v,it.g,it.ok)}</div><div class="pbar"><div class="pfill ${it.v<=it.g?'pok':it.v<=it.ok?'pw':'pd'}" style="width:${Math.min(it.v,100)}%"></div></div></div>`).join('')}</div></div>
  ${gr!==null?`<div class="alert ${Number(gr)>=0?'a-ok':'a-w'} mt12">與上月（${py}年${pm}月 實收 ${$$(prevA)}）相比：${Number(gr)>=0?'▲':'▼'} ${Math.abs(Number(gr))}%</div>`:''}`;
}

// ══════════════════════════════════════════════
//  ANALYSIS
// ══════════════════════════════════════════════
function renderAnalysis(){$('content').innerHTML=`<div class="sh"><div class="st">成本分析報告</div>${ymSel(selYear,selMonth,'rendAnal()')}</div><div id="ab"></div>`;rendAnal();}
function rendAnal(){
  const y=Number($('ym-y')?.value||selYear),m=Number($('ym-m')?.value||selMonth);selYear=y;selMonth=m;
  const days=dyYM(y,m),purs=puYM(y,m),staff=stYM(y,m),exps=exYM(y,m);
  const tRev=days.reduce((s,d)=>s+rev(d).total,0),pC=purs.reduce((s,p)=>s+Number(p.amount||0),0),sC=staff.reduce((s,st)=>s+Number(st.salary||0),0),oC=exps.reduce((s,e)=>s+Number(e.amount||0),0),tExp=pC+sC+oC,profit=tRev-tExp;
  const aT=purs.filter(p=>p.category==='A').reduce((s,p)=>s+Number(p.amount||0),0),bT=purs.filter(p=>p.category==='B').reduce((s,p)=>s+Number(p.amount||0),0);
  const pct=n=>tRev>0?(n/tRev*100).toFixed(1):0;
  const bdg=(r,g=30,ok=45)=>{const n=Number(r);return n<=g?'<span class="mbadge bs">優良 ✓</span>':n<=ok?'<span class="mbadge bw">尚可 !</span>':'<span class="mbadge bd">欠佳 ✗</span>';};
  $('ab').innerHTML=`<div class="card"><div class="card-title">本月營收總覽（${y}年${m}月）</div><div class="cg c3"><div class="metric"><div class="ml">總實收</div><div class="mv fser">${$$(tRev)}</div></div><div class="metric"><div class="ml">總支出</div><div class="mv">${$$(tExp)}</div></div><div class="metric"><div class="ml">淨利</div><div class="mv ${profit>=0?'tok':'tdan'} fser">${profit>=0?'+':''}${$$(profit)}</div></div></div></div>
  <div class="card mt12"><div class="card-title">各項佔比分析</div>${[{label:'A 食材佔比',val:pct(aT),g:20,ok:35},{label:'B 耗材佔比',val:pct(bT),g:5,ok:10},{label:'進貨總佔比',val:pct(pC),g:30,ok:45},{label:'人事薪資佔比',val:pct(sC),g:30,ok:45},{label:'固定費用佔比',val:pct(oC),g:15,ok:25},{label:'總支出佔比',val:pct(tExp),g:60,ok:80}].map(it=>`<div style="margin-bottom:12px"><div class="rf" style="justify-content:space-between;margin-bottom:4px"><span class="tsm">${it.label} ${it.val}%</span>${bdg(it.val,it.g,it.ok)}</div><div class="pbar"><div class="pfill ${Number(it.val)<=it.g?'pok':Number(it.val)<=it.ok?'pw':'pd'}" style="width:${Math.min(Number(it.val),100)}%"></div></div></div>`).join('')}</div>
  <div class="card mt12"><div class="card-title">當月營收狀況報告</div>${profit>=0?`<div class="alert a-ok">本月盈利 ${$$(profit)}，營運${profit/Math.max(tRev,1)*100>20?'良好，持續保持！':'尚可，仍有優化空間。'}</div>`:`<div class="alert a-d">本月虧損 ${$$(Math.abs(profit))}，請檢視各項支出並優化成本結構。</div>`}${pC/Math.max(tRev,1)>0.45?`<div class="alert a-w">進貨成本偏高（${pct(pC)}%），建議審視採購來源。</div>`:''}${sC/Math.max(tRev,1)>0.45?`<div class="alert a-w">人事成本偏高（${pct(sC)}%），建議優化排班。</div>`:''}${pC/Math.max(tRev,1)<=0.35&&sC/Math.max(tRev,1)<=0.30&&profit>=0?`<div class="alert a-ok">進貨與人事佔比皆在標準範圍，成本控制優良！</div>`:''}</div>`;
}

// ══════════════════════════════════════════════
//  YEARLY
// ══════════════════════════════════════════════
function renderYearly(){const yrs=[];for(let i=NOW.getFullYear();i>=2023;i--)yrs.push(i);$('content').innerHTML=`<div class="sh"><div class="st">年度報表</div><div class="fg" style="width:100px"><select id="yr-y" onchange="rendYearly()">${yrs.map(y=>`<option value="${y}"${y==selYear?' selected':''}>${y}年</option>`).join('')}</select></div></div><div id="yb"></div>`;rendYearly();}
function rendYearly(){
  const y=Number($('yr-y')?.value||selYear);selYear=y;const py=y-1;
  const mData=Array.from({length:12},(_,i)=>{
    const m=i+1,days=dyYM(y,m),pDays=dyYM(py,m),rev2=days.reduce((s,d)=>s+rev(d).total,0),pRev=pDays.reduce((s,d)=>s+rev(d).total,0);
    const purs=puYM(y,m),staff=stYM(y,m),exps=exYM(y,m),tExp=purs.reduce((s,p)=>s+Number(p.amount||0),0)+staff.reduce((s,st)=>s+Number(st.salary||0),0)+exps.reduce((s,e)=>s+Number(e.amount||0),0);
    return{m,rev:rev2,pRev,tExp,profit:rev2-tExp,gr:pRev>0?((rev2-pRev)/pRev*100).toFixed(1):null,days:days.length};
  });
  const yT=mData.reduce((s,d)=>s+d.rev,0),yE=mData.reduce((s,d)=>s+d.tExp,0),yP=yT-yE,maxR=Math.max(...mData.map(d=>d.rev),1);
  $('yb').innerHTML=`<div class="cg c3"><div class="metric"><div class="ml">年度總實收</div><div class="mv fser">${$$(yT)}</div></div><div class="metric"><div class="ml">年度總支出</div><div class="mv">${$$(yE)}</div></div><div class="metric"><div class="ml">年度淨利</div><div class="mv ${yP>=0?'tok':'tdan'} fser">${yP>=0?'+':''}${$$(yP)}</div></div></div>
  <div class="card mt12"><div class="card-title">月度視覺圖（${y}年）</div><div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:0 4px">${mData.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:9px;color:var(--text-muted)">${d.rev>0?$$(d.rev):''}</div><div style="width:100%;background:${d.profit>=0?'var(--milk-500)':'var(--danger)'};border-radius:3px 3px 0 0;height:${d.rev>0?Math.max(d.rev/maxR*100,4):2}px"></div><div style="font-size:10px;color:var(--text-muted)">${d.m}月</div></div>`).join('')}</div></div>
  <div class="card mt12"><div class="card-title">1-12月詳細報表</div><div class="sx"><table><thead><tr><th>月份</th><th>工作天</th><th>實收</th><th>支出</th><th>損益</th><th>vs去年同月</th><th>vs上月</th></tr></thead><tbody>${mData.map((d,i)=>{const pm=i>0?mData[i-1].rev:null,mg=pm!==null&&pm>0?((d.rev-pm)/pm*100).toFixed(1):null;return`<tr style="cursor:pointer" onclick="selMonth=${d.m};selYear=${y};navigate('monthly')"><td class="fb">${d.m}月</td><td>${d.days}天</td><td>${d.rev>0?$$(d.rev):'—'}</td><td>${d.tExp>0?$$(d.tExp):'—'}</td><td class="${d.profit>=0&&d.rev>0?'tok':'tdan'}">${d.rev>0?(d.profit>=0?'+':'')+$$(d.profit):'—'}</td><td>${d.gr!==null?`<span class="${Number(d.gr)>=0?'tok':'tdan'}">${Number(d.gr)>=0?'▲':'▼'}${Math.abs(Number(d.gr))}%</span>`:'—'}</td><td>${mg!==null?`<span class="${Number(mg)>=0?'tok':'tdan'}">${Number(mg)>=0?'▲':'▼'}${Math.abs(Number(mg))}%</span>`:'—'}</td></tr>`;}).join('')}</tbody></table></div><div class="tmut tsm mt8">點擊月份可查看詳細月報</div></div>`;
}

// ══════════════════════════════════════════════
//  SETTINGS
// ══════════════════════════════════════════════
function renderSettings(){
  $('content').innerHTML=`<div class="sh"><div class="st">廠商與品項設定</div><div class="tmut tsm">資料儲存於 Supabase 雲端，所有裝置同步</div></div>
  <div class="cg c2">
    <div><div class="ss"><div class="ss-title"><span>常用廠商名單</span><span class="tmut tsm" id="vc2">${C.vendors.length} 個</span></div><div class="chip-list" id="vchips"></div><div class="ai mt8"><input type="text" id="nv" placeholder="輸入新廠商名稱" onkeydown="if(event.key==='Enter')addV()"><button class="btn btn-p btn-sm" onclick="addV()">新增</button></div></div></div>
    <div>
      <div class="ss"><div class="ss-title"><span><span class="tag ta">A 食材</span> 進貨品項</span><span class="tmut tsm" id="ac2">${C.itemsA.length} 項</span></div><div class="chip-list" id="achips"></div><div class="ai mt8"><input type="text" id="na" placeholder="輸入新食材品項" onkeydown="if(event.key==='Enter')addI('A')"><button class="btn btn-p btn-sm" onclick="addI('A')">新增</button></div></div>
      <div class="ss"><div class="ss-title"><span><span class="tag tb">B 耗材</span> 進貨品項</span><span class="tmut tsm" id="bc2">${C.itemsB.length} 項</span></div><div class="chip-list" id="bchips"></div><div class="ai mt8"><input type="text" id="nb" placeholder="輸入新耗材品項" onkeydown="if(event.key==='Enter')addI('B')"><button class="btn btn-p btn-sm" onclick="addI('B')">新增</button></div></div>
    </div>
  </div>
  <div class="alert a-i mt12">所有設定即時同步至 Supabase PostgreSQL，換裝置使用時自動載入</div>`;
  rendChips();
}
function rendChips(){
  const vc=$('vchips'),ia=$('achips'),ib=$('bchips');
  if(vc)vc.innerHTML=C.vendors.map(v=>`<span class="chip chip-v">${v.name}<button class="chip-del" onclick="remV('${v.id}','${v.name.replace(/'/g,"\\'")}')">✕</button></span>`).join('')||'<span class="tmut tsm" style="padding:4px">尚無廠商</span>';
  if(ia)ia.innerHTML=C.itemsA.map(v=>`<span class="chip chip-a">${v.name}<button class="chip-del" onclick="remI('A','${v.id}','${v.name.replace(/'/g,"\\'")}')">✕</button></span>`).join('')||'<span class="tmut tsm" style="padding:4px">尚無品項</span>';
  if(ib)ib.innerHTML=C.itemsB.map(v=>`<span class="chip chip-b">${v.name}<button class="chip-del" onclick="remI('B','${v.id}','${v.name.replace(/'/g,"\\'")}')">✕</button></span>`).join('')||'<span class="tmut tsm" style="padding:4px">尚無品項</span>';
  const vc2=$('vc2');if(vc2)vc2.textContent=C.vendors.length+' 個';
  const ac2=$('ac2');if(ac2)ac2.textContent=C.itemsA.length+' 項';
  const bc2=$('bc2');if(bc2)bc2.textContent=C.itemsB.length+' 項';
}
async function addV(){const inp=$('nv'),val=inp?.value?.trim();if(!val)return;if(vNames().includes(val)){alert('廠商已存在');return;}const[row]=await sbPost('settings_vendors',{name:val});C.vendors.push(row);inp.value='';rendChips();toast('廠商已新增','ok');}
async function remV(id,name){if(!confirm(`確定移除廠商「${name}」？`))return;await sbDelete('settings_vendors',id);C.vendors=C.vendors.filter(v=>v.id!==id);rendChips();toast('已移除');}
async function addI(cat){const inp=$(cat==='A'?'na':'nb'),val=inp?.value?.trim();if(!val)return;const arr=cat==='A'?C.itemsA:C.itemsB,tbl=cat==='A'?'settings_items_a':'settings_items_b';if(arr.map(v=>v.name).includes(val)){alert('品項已存在');return;}const[row]=await sbPost(tbl,{name:val});arr.push(row);inp.value='';rendChips();toast('品項已新增','ok');}
async function remI(cat,id,name){if(!confirm(`確定移除品項「${name}」？`))return;const tbl=cat==='A'?'settings_items_a':'settings_items_b';await sbDelete(tbl,id);if(cat==='A')C.itemsA=C.itemsA.filter(v=>v.id!==id);else C.itemsB=C.itemsB.filter(v=>v.id!==id);rendChips();toast('已移除');}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
document.querySelectorAll('.nav-item[data-p]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.p)));
$('tdate').textContent=NOW.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

(async()=>{
  sync('syncing','連線中...');
  try{

  }

</script>
